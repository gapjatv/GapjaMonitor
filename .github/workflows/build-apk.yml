# 운빨보스알림 안드로이드 앱 — GitHub 서버에서 APK 를 만든다.
# 코드를 올리거나(Actions 탭에서 'Run workflow') 누르면 빌드되고,
# 결과 APK 는 실행 결과 화면 아래 'Artifacts' 에서 내려받는다.
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # GitHub 서버에는 Android SDK 가 이미 깔려 있다 — 라이선스 동의만 해 둔다
      - name: Accept Android SDK licenses
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true

      # 깃허브 사진 저장소(gapjatv/png)의 phone/ · mumu/ 사진을 앱 기본 사진에 덮어 넣는다 (v2.8)
      # 앱에서 등록한 사진이 자동으로 올라가는 곳이다. 가져오지 못하면 저장소에 있던 사진으로 그대로 빌드한다.
      - name: Sync boss photos from gapjatv/png
        env:
          PNG_TOKEN: ${{ secrets.PNG_TOKEN }}
        run: python3 .github/scripts/sync_png.py

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Read version
        id: ver
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "v=$V" >> "$GITHUB_OUTPUT"
          echo "version: $V"

      - name: Rename APK
        run: |
          mkdir -p out
          V=${{ steps.ver.outputs.v }}
          D=app/build/outputs/apk/debug
          cp $D/app-arm64-v8a-debug.apk   out/UnbbalBossAlarm-v$V-phone.apk
          cp $D/app-armeabi-v7a-debug.apk out/UnbbalBossAlarm-v$V-phone32.apk
          cp $D/app-x86_64-debug.apk      out/UnbbalBossAlarm-v$V-mumu.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: UnbbalBossAlarm-apk
          path: out/*.apk
          retention-days: 30

      # 폰에서 바로 받을 수 있게 Releases 페이지에도 올린다 (같은 버전이면 파일만 교체)
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=v${{ steps.ver.outputs.v }}
          gh release view $V >/dev/null 2>&1 || \
            gh release create $V --title "운빨보스알림 $V" --target "$GITHUB_SHA" --notes "폰·태블릿: -phone.apk / 오래된 32비트 폰: -phone32.apk / 뮤뮤플레이어 등 PC 앱플레이어: -mumu.apk"
          gh release upload $V out/*.apk --clobber

      # 최신 APK 를 'apk' 브랜치에도 보관한다
      - name: Store APK on apk branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          mkdir -p /tmp/apkbr && cp out/*.apk /tmp/apkbr/
          git checkout --orphan apk-tmp
          git rm -rfq . || true
          cp /tmp/apkbr/*.apk .
          git add *.apk
          git commit -qm "APK ${GITHUB_SHA::7}"
          git push -f origin apk-tmp:apk
