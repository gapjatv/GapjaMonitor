# 갑자TV 관제탑 안드로이드판 — GitHub 서버에서 APK 를 만든다.
# 코드를 올리거나(Actions 탭에서 'Run workflow') 누르면 빌드되고,
# 결과 APK 는 실행 결과 화면 아래 'Artifacts' 에서 내려받는다.
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub 서버에는 Android SDK 가 이미 깔려 있다 — 라이선스 동의만 해 둔다
      - name: Accept Android SDK licenses
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/GapjaMonitor-v1.1.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: GapjaMonitor-apk
          path: out/GapjaMonitor-v1.1.apk
          retention-days: 30
